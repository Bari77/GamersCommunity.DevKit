<div class="gc-workspace">
    <aside class="gc-workspace__rail">
        <gc-widget-nav
            [pages]="view().pages"
            [activeId]="activePageId()"
            [editing]="editing()"
            [ariaLabel]="navLabel()"
            [addLabel]="addPageLabel()"
            [removeLabel]="removePageLabel()"
            [moveUpLabel]="moveUpLabel()"
            [moveDownLabel]="moveDownLabel()"
            (select)="activePageId.set($event)"
            (add)="onAddPage()"
            (rename)="onRenamePage($event)"
            (remove)="onRemovePage($event)"
            (move)="onMovePage($event)"
        />
    </aside>

    <div class="gc-workspace__main">
        <header class="gc-workspace__bar">
            <h2 class="gc-workspace__page">{{ activePage()?.title }}</h2>

            <div class="gc-workspace__tools">
                @if (editing()) {
                    <button type="button" class="gc-workspace__button" (click)="pickerOpen.set(!pickerOpen())">
                        + {{ addWidgetLabel() }}
                    </button>
                }
                @if (canEdit()) {
                    <gc-widget-edit-bar
                        [(editing)]="editing"
                        [saving]="saving()"
                        [editLabel]="editLabel()"
                        [cancelLabel]="cancelLabel()"
                        [saveLabel]="saveLabel()"
                        (cancel)="onCancel()"
                        (save)="onSave()"
                    />
                }
            </div>
        </header>

        @if (editing()) {
            <p class="gc-workspace__hint">{{ hintLabel() }}</p>
        }

        @if (editing() && pickerOpen()) {
            <gc-widget-picker
                [catalog]="catalog()"
                [usedTypes]="usedTypes()"
                [title]="addWidgetLabel()"
                (pick)="onPickWidget($event)"
                (close)="pickerOpen.set(false)"
            />
        }

        @if (configuring(); as target) {
            <gc-widget-settings
                [entry]="target.entry"
                [settings]="target.widget.settings"
                [titleLabel]="widgetTitleLabel()"
                [doneLabel]="doneLabel()"
                [moveUpLabel]="moveUpLabel()"
                [moveDownLabel]="moveDownLabel()"
                (settingsChange)="onSettingsChange($event)"
                (close)="onCloseSettings()"
            >
                @if (settingsTemplateFor(target.widget.type); as tpl) {
                    <ng-container
                        [ngTemplateOutlet]="tpl"
                        [ngTemplateOutletContext]="{ $implicit: target.widget.settings, instance: target.widget }"
                    />
                }
            </gc-widget-settings>
        }

        <gc-widget-grid
            [widgets]="activePage()?.widgets ?? []"
            [catalog]="catalog()"
            [defs]="defs()"
            [editing]="editing()"
            [canConfigure]="canEdit()"
            [columns]="columns()"
            [rowHeight]="rowHeight()"
            [gap]="gap()"
            [emptyLabel]="emptyPageLabel()"
            [settingsLabel]="settingsLabel()"
            [removeLabel]="removeWidgetLabel()"
            (positionsChange)="onPositions($event)"
            (remove)="onRemoveWidget($event)"
            (configure)="onConfigure($event)"
        />
    </div>
</div>

<ng-content />
