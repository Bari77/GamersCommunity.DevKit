<header class="shell">
    <div class="shell__identity">
        <h1>Workspace editor</h1>
        <p class="shell__hint">Save writes the layout JSON in the game repo. Existing profiles are unchanged.</p>
    </div>

    <div class="shell__picker">
        <span class="shell__label">Layout</span>
        <gc-widget-select
            class="shell__select"
            ariaLabel="Layout to edit"
            [options]="options()"
            [value]="currentId()"
            [disabled]="loading() || saving()"
            (valueChange)="open($event)"
        />
    </div>
</header>

@if (error()) {
    <p class="shell__error" role="alert">{{ error() }}</p>
}

@if (loading()) {
    <p class="shell__loading">Loading workspace…</p>
} @else if (workspace(); as current) {
    <gc-widget-workspace
        class="workspace"
        [workspace]="current"
        [catalog]="catalog()"
        [canEdit]="true"
        [preview]="true"
        [saving]="saving()"
        [columns]="columns()"
        [rowHeight]="rowHeight()"
        [pageVisibilityOptions]="pageVisibilityOptions()"
        [(editing)]="editing"
        navLabel="Pages"
        (save)="onSave($event)"
    >
        @if (templateHost(); as host) {
            <ng-container *ngComponentOutlet="host; inputs: { preview: true }" />
        }
    </gc-widget-workspace>
}
