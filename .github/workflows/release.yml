name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bari77/gc-devgateway

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com
          scope: "@bari77"

      # Bump versions before install so workspace deps never pin a missing registry version.
      # Source packages use "@bari77/gc-sdk": "*" (workspace link); publish pins the exact tag version.
      - name: Set npm package versions
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          for ws in @bari77/gc-sdk @bari77/gc-msw @bari77/gc-playground @bari77/gc-ui @bari77/gc-widgets @bari77/gc-theme @bari77/gc-workspace-editor @bari77/gc-create-game; do
            npm pkg set "version=${VERSION}" --workspace="$ws"
          done
          npm pkg set "dependencies.@bari77/gc-sdk=${VERSION}" --workspace=@bari77/gc-msw
          npm pkg set "dependencies.@bari77/gc-sdk=${VERSION}" --workspace=@bari77/gc-playground
          npm pkg set "dependencies.@bari77/gc-widgets=${VERSION}" --workspace=@bari77/gc-workspace-editor
          npm pkg set "peerDependencies.@bari77/gc-widgets=${VERSION}" --workspace=@bari77/gc-workspace-editor

      - name: Install workspaces
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build packages
        run: npm run build

      - name: Publish npm packages
        run: |
          # sdk first — msw/playground depend on it
          npm publish --workspace=@bari77/gc-sdk --access restricted
          npm publish --workspace=@bari77/gc-msw --access restricted
          npm publish --workspace=@bari77/gc-playground --access restricted
          # gc-ui: ng-packagr écrit le paquet dans dist/ (FESM), pas le TypeScript source
          npm publish ./packages/ui/dist --access restricted
          npm publish --workspace=@bari77/gc-widgets --access restricted
          npm publish --workspace=@bari77/gc-theme --access restricted
          npm publish --workspace=@bari77/gc-workspace-editor --access restricted
          npm publish --workspace=@bari77/gc-create-game --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push DevGateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/DevGateway/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          secrets: |
            nuget_token=${{ secrets.GITHUB_TOKEN }}

      # CHANGELOG.json is also what the documentation site renders, so a version cannot describe
      # itself differently in the release and in the docs.
      - name: Build release notes
        run: |
          node .github/scripts/release-notes.mjs "${{ steps.ver.outputs.version }}" > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DevKit ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body_path: release-notes.md
