<gcd-page
    lead="Empilement de lignes de squelette imitant un paragraphe, avec une dernière ligne plus courte pour que le bloc se lise comme du texte."
>
    <p>
        C'est un assemblage de
        <code>gc-skeleton</code>
        , pensé pour le cas très fréquent du bloc de texte. Plutôt que d'aligner des lignes à la main, on donne leur
        nombre.
    </p>

    <gcd-demo
        title="Paragraphe par défaut"
        description="Trois lignes, la dernière à 60 % de large."
        [html]="basicHtml"
        [bare]="true"
    >
        <gc-skeleton-text />
    </gcd-demo>

    <gcd-demo
        title="Bloc dense"
        description="Plus de lignes, resserrées et plus fines."
        [html]="denseHtml"
        [bare]="true"
    >
        <gc-skeleton-text [lines]="6" lineHeight="0.7rem" gap="0.35rem" lastLineWidth="40%" />
    </gcd-demo>

    <h2>Usage courant</h2>

    <gcd-code language="html" [code]="usageSnippet" />

    <h2>API</h2>

    <gcd-api heading="Entrées" [rows]="inputs" />

    <div class="gcd-note">
        <p>
            <code>lines</code>
            est ramené à 1 au minimum : une valeur nulle ou négative n'efface pas le bloc, elle affiche une seule ligne.
        </p>
    </div>
</gcd-page>
