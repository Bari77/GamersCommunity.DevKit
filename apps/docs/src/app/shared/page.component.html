<header class="page__head">
    @if (head.eyebrow) {
        <span class="page__eyebrow">{{ head.eyebrow }}</span>
    }
    <h1 class="page__title">{{ head.heading }}</h1>
    @if (head.selector) {
        <code class="page__selector">&lt;{{ head.selector }} /&gt;</code>
    }
    @if (lead()) {
        <p class="page__lead">{{ lead() }}</p>
    }
</header>

@if (head.importSnippet) {
    <gcd-code [code]="head.importSnippet" language="typescript" label="Import" />
}

<div class="gcd-prose">
    <ng-content />
</div>
