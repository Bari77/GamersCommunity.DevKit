<div class="code">
    <div class="code__bar">
        <span class="code__label">{{ label() || language() }}</span>
        <button type="button" class="code__copy" (click)="copy()">
            {{ copied() ? "Copié" : "Copier" }}
        </button>
    </div>
    <pre class="code__body"><code [innerHTML]="highlighted()"></code></pre>
</div>
